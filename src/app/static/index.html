<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen RAG 智能助手</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <div>
            <p class="eyebrow">PYTHON · LANGGRAPH · QWEN · MCP · RAG</p>
            <h1>知识增强智能助手</h1>
            <p class="subtitle">知识库由 PGVector 保存，计算问题自动交给 MCP 工具。</p>
        </div>
        <div class="header-actions">
            <a class="secondary-button navigation-button" href="/knowledge.html">管理知识库</a>
            <button id="knowledgeButton" class="secondary-button" type="button">添加知识</button>
            <button id="newChatButton" class="secondary-button" type="button">新建会话</button>
        </div>
    </header>

    <section class="toolbar" aria-label="聊天设置">
        <label class="mode-control">
            <span>回答方式</span>
            <select id="modeSelect">
                <option value="stream">SSE 回答</option>
                <option value="sync">同步回答</option>
            </select>
        </label>
        <div id="connectionStatus" class="status idle"><span></span>准备就绪</div>
    </section>

    <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="message-body">
                <div class="bubble">你好！我支持知识库问答、精确计算，以及设备定位、托管图层、区域绘制和基建工程浏览。</div>
            </div>
        </article>
    </section>

    <form id="chatForm" class="composer">
        <label class="sr-only" for="messageInput">输入消息</label>
        <textarea id="messageInput" maxlength="4000" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行" required></textarea>
        <div class="composer-actions">
            <span id="characterCount">0 / 4000</span>
            <button id="stopButton" class="stop-button hidden" type="button">停止</button>
            <button id="sendButton" class="send-button" type="submit">发送</button>
        </div>
    </form>
</main>

<dialog id="knowledgeDialog" class="knowledge-dialog">
    <form id="knowledgeForm" method="dialog">
        <div class="dialog-heading">
            <div>
                <p class="eyebrow">RAG KNOWLEDGE</p>
                <h2>添加知识</h2>
            </div>
            <button id="closeKnowledgeButton" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <label for="knowledgeSource">来源（可选）</label>
        <input id="knowledgeSource" maxlength="200" placeholder="例如：产品手册 / 客服规范">
        <label for="knowledgeContent">知识内容</label>
        <textarea id="knowledgeContent" maxlength="20000" rows="10" placeholder="粘贴需要检索的文本内容……" required></textarea>
        <p id="knowledgeStatus" class="dialog-status" aria-live="polite"></p>
        <div class="dialog-actions">
            <button id="cancelKnowledgeButton" class="secondary-button" type="button">取消</button>
            <button id="saveKnowledgeButton" class="send-button" type="submit">向量化并保存</button>
        </div>
    </form>
</dialog>

<script src="/app.js?v=20260824-2"></script>
</body>
</html>
